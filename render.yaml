# Render Blueprint for the Mu Katale API: one web service. The database is not
# here — it runs on Neon and this file only says where its connection string
# comes from. Push this branch, then create the Blueprint from the Render
# dashboard ("New+" > Blueprint) pointing at this repo.
#
# The shop itself is not here either. It is a static bundle published by
# .github/workflows/deploy-pages.yml, so this API answers requests that arrive
# from another site. That is what WEB_ORIGINS switches on; see
# api/src/lib/webOrigins.ts and DEPLOYING.md before changing it.
#
# Everything below is on free plans, which carry limits worth knowing before a
# demo: the service sleeps after 15 idle minutes and takes about a minute to
# wake, its filesystem is wiped on every restart, and Neon suspends its compute
# after 5 idle minutes with 1 GB of storage and 100 compute hours a month. None
# of them delete your data when you run out — they just stop answering.

services:
  - type: web
    name: mu-katale-api
    runtime: node
    # The repo is a monorepo: the Vite app at the root, the Next.js API here.
    rootDir: api
    plan: free
    # The free Render regions are Singapore, Ohio and Oregon, so this is the
    # pairing that matters: every request queries the database, and the hop that
    # costs is Render -> Neon, not shopper -> Render. Neon's aws-us-east-2 is in
    # the same state as Render's Ohio region, and Ohio is still the shortest of
    # the three from Kampala (~180ms). If the plan is ever upgraded, move the
    # service to Frankfurt and the database to Neon's eu-central-1 together —
    # one without the other just moves the latency somewhere else.
    region: ohio
    branch: main
    autoDeployTrigger: commit
    # Monorepo filter: a commit that only touches the shop or the docs would
    # otherwise build and restart a service nobody asked to redeploy. This file
    # is in the list because it can change how the service runs.
    buildFilter:
      paths:
        - api/**
        - render.yaml
    # Returns 503 while the database is unreachable, so Render waits for real
    # readiness instead of accepting any port that opens.
    healthCheckPath: /api/health

    # --include=dev matters: Render sets NODE_ENV=production, which makes npm ci
    # skip devDependencies, and `next build` type checks with the TypeScript and
    # @types packages that live there.
    buildCommand: npm ci --include=dev && npm run build
    # `next start` binds to the PORT Render assigns. Do not pin a port in the
    # start command — Render routes to 10000, not 3000.
    startCommand: npm start

    # Reconcile the Neon schema with src/db/schema.ts after each successful build
    # and before the new instance takes traffic. There are no migration files, so
    # `drizzle-kit migrate` (what the Docker entrypoint runs) is a no-op; db:push
    # is the documented way the schema arrives. For a database that is behind the
    # code this diff is additive (new columns/tables only), and drizzle aborts
    # rather than dropping data if the change would be destructive. Needs a plan
    # that supports pre-deploy commands; if it does not, run `npm run db:push` by
    # hand (see DEPLOYING.md).
    preDeployCommand: npm run db:push

    envVars:
      # Pinned to the version the Docker build and CI use, so a Render default
      # change cannot silently move the runtime.
      - key: NODE_VERSION
        value: 22.20.0
      # Paste Neon's POOLED connection string here when the Blueprint asks
      # (Dashboard > Project > Connection details, the host ending
      # "-pooler.us-east-2.aws.neon.tech"). Keep the ?sslmode=require suffix:
      # node-postgres reads it and turns TLS on. The pooled host is the one that
      # survives a sleeping compute; the direct host is for psql and the SQL
      # editor.
      #
      # sync: false means Render asks once and never overwrites it, so the
      # secret stays in the dashboard and out of this repository. Changing the
      # database later means editing it in the service's Environment tab.
      - key: DATABASE_URL
        sync: false
      # Render terminates TLS and forwards through a proxy, so the real client
      # address arrives in X-Forwarded-For. Without this, rate limiting and the
      # activity log would record Render's proxy instead of the shopper.
      - key: TRUST_PROXY
        value: 'true'
      # The one switch for cross-site access: CORS for this origin, CSRF
      # allowance for it, and SameSite=None; Secure on session cookies. Exact
      # origins only — credentials are shared, so a wildcard is never accepted.
      # Add the custom domain here if the shop ever moves off github.io.
      - key: WEB_ORIGINS
        value: https://rwangoga.github.io
      # Uploaded product images. The free filesystem does not survive a
      # restart, which is acceptable today because the SPA only ever renders
      # bundled images from src/assets and never reads /api/assets. Attach a
      # persistent disk (paid) before relying on admin uploads.
      - key: UPLOAD_DIR
        value: /tmp/mu-katale-uploads
      # Verified by the webhook route's HMAC check. No gateway posts to it yet,
      # so a generated value only has to be stable across restarts.
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
