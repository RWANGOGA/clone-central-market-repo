name: Deploy shop to GitHub Pages

# The Vite single-page app is built here and published as a Pages artifact. The
# API is not part of this workflow — it lives on Render, described in
# render.yaml and DEPLOYING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required by upload-pages-artifact / deploy-pages.
  pages: write
  id-token: write

# Only one Pages deployment at a time. Cancelling an in-progress build is safe
# here because nothing is published until the deploy job runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The API origin is not a secret — it ships inside the bundle, plainly
    # visible to anyone who opens devtools — so it defaults to the Render service
    # in this file, where it can be reviewed and reverted like any other code.
    # A repository variable of the same name still overrides it, which is what
    # to use the moment the API moves to a custom domain. It has to agree with
    # WEB_ORIGINS on the Render side; see DEPLOYING.md.
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://clone-central-market-repo-1.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the API URL is configured
        run: |
          set -eu
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::No API origin: API_BASE_URL is empty both as a repository variable and as this workflow's default."
            echo "The build bakes this in, so it cannot be fixed after deployment."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*/*) echo "::error::API_BASE_URL must be an origin only (no path, no trailing slash): $API_BASE_URL"; exit 1;;
          esac
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            echo "API origin: $API_BASE_URL (repository variable)"
          else
            echo "API origin: $API_BASE_URL (workflow default; set the API_BASE_URL variable to override)"
          fi

      # configure-pages knows the path a project site is really served from
      # (/<repository>/), which is what Vite's base and the router's basename
      # have to agree on. Deriving it here beats guessing from the repo name.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci --prefer-offline --no-audit --maxsockets 3

      - name: Build
        env:
          VITE_API_BASE: ${{ env.API_BASE_URL }}
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Publish a fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Check the artifact
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -eu
          base="${BASE_PATH%/}"
          if [ -z "$base" ]; then base=""; fi

          # A wrong base is a blank page, not an error message, so prove the
          # bundle points at where the site will actually be served from.
          if ! grep -q "\"$base/assets/" dist/index.html; then
            echo "::error::dist/index.html does not load assets from $base/assets/."
            exit 1
          fi
          # A missing base is worse still: the app would call Pages' own /api
          # and every request would 404 while looking like a lost login.
          if ! grep -qF "$API_BASE_URL" dist/assets/*.js; then
            echo "::error::the bundle does not contain $API_BASE_URL; VITE_API_BASE was not applied."
            exit 1
          fi
          test -f dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
