name: CI

on:
  push:
    branches: [main, fix/phase7-infra]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --maxsockets 3
        working-directory: api
      - run: npm run typecheck
        working-directory: api

  # The front end had no type gate: `vite build` runs esbuild, which strips
  # types without checking them, so errors that fail the API were invisible in
  # the SPA. This mirrors the api typecheck job at the repo root, where the
  # strict tsconfig added in Phase A lives, so the design foundation can't
  # silently rot the same way again. It inherits the workflow-level triggers
  # below, so it runs on PRs and on pushes to main.
  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --maxsockets 3
      - run: npm run typecheck

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --maxsockets 3
        working-directory: api
      - run: npm test
        working-directory: api

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --maxsockets 3
        working-directory: api
      - run: npm audit --audit-level=critical
        working-directory: api

  build:
    runs-on: ubuntu-latest
    # `next build` imports every route to collect page data, and lib/env.ts
    # validates the environment while those modules load, so a build with no
    # environment fails on missing keys rather than on anything about the code.
    # Nothing connects to the database during a build, so these values only have
    # to satisfy the schema. Render and the docker stack supply the real ones.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      PAYMENT_WEBHOOK_SECRET: ci-only-not-a-real-secret
      UPLOAD_DIR: ./uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --maxsockets 3
        working-directory: api
      - run: npm run build
        working-directory: api
      - run: npm ci --prefer-offline --no-audit --maxsockets 3
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t grocery-api:ci -f Dockerfile.api .
      - run: docker build -t grocery-frontend:ci -f Dockerfile.frontend .

# Secret scanning: enable "Secret scanning" and "Push protection" under
# Settings > Code security and analysis on GitHub. Dependabot version updates
# are configured in .github/dependabot.yml.
